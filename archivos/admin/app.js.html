<script>
(() => {
  'use strict';
  const $ = id => document.getElementById(id);
  const fmtMoney = new Intl.NumberFormat('es-MX', {style:'currency',currency:'MXN',maximumFractionDigits:0});
  const fmtPrice = new Intl.NumberFormat('es-MX', {style:'currency',currency:'MXN',minimumFractionDigits:2,maximumFractionDigits:2});
  const fmtNum = new Intl.NumberFormat('es-MX');
  const fmtDate = new Intl.DateTimeFormat('es-MX', {day:'numeric',month:'long',year:'numeric'});
  const fmtShort = new Intl.DateTimeFormat('es-MX', {day:'numeric',month:'short'});
  const fmtTime = new Intl.DateTimeFormat('es-MX', {timeZone:'America/Mexico_City',hour:'2-digit',minute:'2-digit',hour12:false});
  const fmtLocalDay = new Intl.DateTimeFormat('en-CA', {timeZone:'America/Mexico_City',year:'numeric',month:'2-digit',day:'2-digit'});
  const vistas = ['dashboard','agenda','clientes','servicios','reportes','config'];
  const state = {csrf:'',view:'dashboard',generation:0,pages:{agenda:1,clientes:1},date:localDate(),query:'',pending:null,pendingPrice:null};
  function localDate(){const parts=Object.fromEntries(fmtLocalDay.formatToParts(new Date()).map(p=>[p.type,p.value]));return `${parts.year}-${parts.month}-${parts.day}`;}
  function el(tag, className, text){const node=document.createElement(tag);if(className)node.className=className;if(text!==undefined)node.textContent=String(text);return node;}
  function append(parent,...children){children.forEach(child=>parent.append(child));return parent;}
  function money(n){return n!==null&&n!==undefined&&n!==''&&Number.isFinite(Number(n)) ? fmtMoney.format(Number(n)) : '—';}
  function price(n){return n!==null&&n!==undefined&&n!==''&&Number.isFinite(Number(n)) ? fmtPrice.format(Number(n)) : '—';}
  function number(n){return n!==null&&n!==undefined&&n!==''&&Number.isFinite(Number(n)) ? fmtNum.format(Number(n)) : '—';}
  function date(s){if(!s)return '—';const d=new Date(String(s).slice(0,10)+'T12:00:00');return Number.isNaN(d.getTime())?'—':fmtDate.format(d);}
  function shortDate(s){const d=new Date(String(s).slice(0,10)+'T12:00:00');return Number.isNaN(d.getTime())?'—':fmtShort.format(d);}
  function time(s){if(!s)return '—';const v=String(s);if(/^\d{2}:\d{2}/.test(v))return v.slice(0,5);const d=new Date(v);return Number.isNaN(d.getTime())?'—':fmtTime.format(d);}
  function array(v){return Array.isArray(v)?v:[];}
  function notice(text, kind){const n=el('div','notice'+(kind?' '+kind:''),text);return n;}
  function section(title,subtitle){const wrap=el('section','section');const heading=el('div','section-heading');append(heading,el('h2','',title));if(subtitle)append(heading,el('small','',subtitle));wrap.append(heading);return wrap;}
  function empty(title,body){const e=el('div','status');append(e,el('strong','',title),el('p','',body));return e;}
  function loading(view){const root=$('contenido-'+view);root.replaceChildren(el('p','loading','Consultando información actual…'));}
  function errorView(view,message){const root=$('contenido-'+view);const box=empty('No se pudo cargar esta sección',message||'Revisa la conexión e inténtalo de nuevo. Los datos anteriores se ocultaron para evitar confusiones.');const button=el('button','action','Reintentar');button.type='button';button.addEventListener('click',()=>load(view));box.append(button);root.replaceChildren(box);}
  async function api(path,options={}){
    const method=options.method||'GET';const headers={'Accept':'application/json'};
    if(method!=='GET'){headers['Content-Type']='application/json';if(state.csrf)headers['X-CSRF-Token']=state.csrf;}
    let response;
    try{response=await fetch('/api/admin/'+path,{method,credentials:'same-origin',cache:'no-store',headers,body:options.body?JSON.stringify(options.body):undefined});}
    catch(_){throw new Error('No hay conexión con el servidor. Comprueba la red y vuelve a intentarlo.');}
    let payload;
    try{payload=await response.json();}catch(_){throw new Error('El servidor devolvió una respuesta inesperada. Inténtalo de nuevo.');}
    if(response.status===401 && path!=='sesion' && path!=='login'){lock();throw new Error('La sesión terminó. Vuelve a iniciar sesión.');}
    if(!response.ok || payload?.ok!==true){const err=new Error(payload?.error?.message||'No se pudo completar la solicitud.');err.code=payload?.error?.code;err.status=response.status;throw err;}
    return payload.data;
  }
  function lock(){state.generation++;state.csrf='';state.pending=null;state.pendingPrice=null;if($('precio-dialogo').open)$('precio-dialogo').close();$('panel').hidden=true;$('acceso').hidden=false;vistas.forEach(v=>$('contenido-'+v).replaceChildren());$('password').value='';if($('mensaje-dialogo').open)$('mensaje-dialogo').close();}
  function unlock(data){state.csrf=data.csrfToken||'';$('acceso').hidden=true;$('panel').hidden=false;$('login-error').hidden=true;show(state.view);}
  async function checkSession(){try{unlock(await api('sesion'));}catch(err){lock();if(err.status!==401){$('login-error').textContent=err.message;$('login-error').hidden=false;}}}
  function show(view){if(!vistas.includes(view))return;state.view=view;state.generation++;document.querySelectorAll('.nav-item').forEach(button=>{const active=button.dataset.vista===view;button.classList.toggle('activo',active);button.setAttribute('aria-current',active?'page':'false');});document.querySelectorAll('.vista').forEach(panel=>panel.hidden=panel.dataset.vistaPanel!==view);window.scrollTo({top:0,behavior:'auto'});load(view);}
  function metadata(meta){if(!meta)return null;const status=meta.sinCitas?'No hay citas registradas en Postgres. Esto no confirma disponibilidad en Google Calendar. ':' ';const last=meta.ultimaActualizacionCitas?' Última actualización de citas: '+date(meta.ultimaActualizacionCitas)+'.':'';const text=status+(meta.advertencia||'Fuente: Postgres. Google Calendar o Sheets pueden diferir.')+last;return notice(text.trim());}
  function metric(label,value,primary){const card=el('article','surface metric'+(primary?' metric-primary':''));append(card,el('span','metric-label',label),el('strong','',value));return card;}
  function kpiGrid(k){const grid=el('div','grid metrics');const fields=[['Ingresos hoy',money(k.ingresosHoy),true],['Ingresos esta semana',money(k.ingresosSemana)],['Ingresos este mes',money(k.ingresosMes)],['Ticket promedio hoy',money(k.ticketPromedioHoy)],['Ticket promedio mes',money(k.ticketPromedioMes)],['Inasistencias del mes',number(k.noShowsMes)],['Cancelaciones del mes',number(k.cancelacionesMes)],['Próximas 7 días',number(k.proximas7Dias)]];fields.forEach(([label,value,primary])=>grid.append(metric(label,value,primary)));return grid;}
  function messageButton(record){const id=record?.id;const jid=record?.jid; if(!jid)return null;const b=el('button','plain action','Mensaje');b.type='button';b.setAttribute('aria-label','Preparar mensaje para '+String(record.nombre||'cliente'));b.addEventListener('click',()=>openMessage(id?{cita_id:id}:{cliente_id:jid},record.nombre||'cliente'));return b;}
  function appointments(items){if(!items.length)return empty('No hay citas en este periodo','No hay citas registradas en Postgres para este periodo. Comprueba Google Calendar antes de asumir que hay disponibilidad.');const list=el('div','surface list');items.forEach(c=>{const row=el('article','row');append(row,el('span','time',time(c.inicio||c.fecha||c.hora)));const main=el('div','row-main');append(main,el('div','row-title',c.nombre||'Cliente sin nombre'),el('div','row-detail',(c.servicio||'Servicio no especificado')+' · '+money(c.precio)));row.append(main);const status=el('span','tag '+String(c.estado||'').toLowerCase().replace(/[^a-z_]/g,''),c.estado||'Sin estado');row.append(status);const action=messageButton(c);if(action){const slot=el('div','row-extra');slot.append(action);row.append(slot);}list.append(row);});return list;}
  function bars(items,key,labelKey,format){if(!items.length)return empty('Aún no hay datos suficientes','Los registros disponibles aparecerán aquí cuando existan.');const max=Math.max(...items.map(x=>Math.max(0,Number(x[key])||0)),1);const root=el('div','bar-list');items.forEach(x=>{const n=Math.max(0,Number(x[key])||0);const row=el('div','bar-row');append(row,el('span','',labelKey(x)),append(el('div','track'),el('span','fill')));row.querySelector('.fill').style.width=(n/max*100).toFixed(1)+'%';row.append(el('span','money',format(n)));root.append(row);});return root;}
  function chart(daily){const s=section('Ingresos registrados','Últimos 30 días');const surface=el('div','surface');append(surface,bars(array(daily),'ingresos',x=>shortDate(x.fecha),money));s.append(surface);return s;}
  function renderDashboard(data){const root=$('contenido-dashboard');root.replaceChildren();if(metadata(data.meta))root.append(metadata(data.meta));$('subtitulo-dashboard').textContent='La actividad del negocio, según los registros disponibles.';const split=el('div','split');const today=section('Hoy',date(localDate()));today.append(appointments(array(data.hoy)));const upcoming=section('Próximas citas');upcoming.append(appointments(array(data.proximas)));append(split,today,upcoming);root.append(split);const k=section('En números');k.append(kpiGrid(data.kpis||{}));root.append(k);root.append(chart(data.grafica30));}
  function pagination(root,info,view){if(!info||info.totalPages<=1)return;const bar=el('div','pagination');const prev=el('button','plain','Anterior');const next=el('button','plain','Siguiente');prev.type=next.type='button';prev.disabled=info.page<=1;next.disabled=info.page>=info.totalPages;prev.addEventListener('click',()=>{state.pages[view]--;load(view);});next.addEventListener('click',()=>{state.pages[view]++;load(view);});append(bar,prev,el('span','',`Página ${info.page} de ${info.totalPages}`),next);root.append(bar);}
  function renderAgenda(data){const root=$('contenido-agenda');root.replaceChildren();if(metadata(data.meta))root.append(metadata(data.meta));const toolbar=el('div','toolbar');const label=el('label','','A partir de');const input=el('input');input.type='date';input.value=state.date;input.addEventListener('change',()=>{state.date=input.value||localDate();state.pages.agenda=1;load('agenda');});append(label,input);toolbar.append(label);root.append(toolbar,appointments(array(data.items)));pagination(root,data.pagination,'agenda');$('subtitulo-agenda').textContent='Citas registradas desde '+date(state.date)+'.';}
  function renderClientes(data){const root=$('contenido-clientes');root.replaceChildren();if(metadata(data.meta))root.append(metadata(data.meta));const form=el('form','toolbar');form.setAttribute('role','search');const label=el('label','','Buscar cliente');const input=el('input');input.type='search';input.placeholder='Nombre o teléfono';input.value=state.query;input.maxLength=100;append(label,input);const submit=el('button','action','Buscar');submit.type='submit';append(form,label,submit);form.addEventListener('submit',e=>{e.preventDefault();state.query=input.value.trim();state.pages.clientes=1;load('clientes');});root.append(form);const clients=array(data.items);if(!clients.length)root.append(empty('No se encontraron clientes',state.query?'Prueba otro nombre o teléfono.':'Los clientes aparecerán cuando existan registros.'));else{const list=el('div','surface list');clients.forEach(c=>{const row=el('article','row');append(row,el('span','time',c.etiqueta||'Cliente'));const info=el('div','row-main');append(info,el('div','row-title',c.nombre||'Sin nombre'),el('div','row-detail',(c.telefono||'Sin teléfono')+' · '+number(c.visitas)+' visitas · Última: '+date(c.ultimaVisita)));row.append(info);row.append(el('span','money',money(c.ticketPromedio)));const action=messageButton(c);if(action){const slot=el('div','row-extra');slot.append(action);row.append(slot);}list.append(row);});root.append(list);}pagination(root,data.pagination,'clientes');$('subtitulo-clientes').textContent='Personas registradas y su historial disponible.';}
  function renderServicios(data){const root=$('contenido-servicios');root.replaceChildren();if(metadata(data.meta))root.append(metadata(data.meta));const services=array(data.items);if(!services.length){root.append(empty('No hay servicios registrados','Los servicios activos se mostrarán cuando el servidor tenga datos.'));return;}const block=section('Catálogo de servicios');if(!data.preciosEditables)block.append(notice('La edición de precios está deshabilitada hasta verificar que el agente usa el catálogo actual.'));const list=el('div','surface');services.forEach(s=>{const row=el('article','service');const top=el('div','service-top');const actions=el('div','service-actions');actions.append(el('span','money',s.clave==='depilacion'?'Según zona':price(s.precio)));if(data.preciosEditables&&s.activo&&s.clave!=='depilacion'){const edit=el('button','plain','Editar precio');edit.type='button';edit.addEventListener('click',()=>openPrice(s));actions.append(edit);}append(top,el('strong','',s.nombre||'Servicio'),actions);append(row,top,el('div','service-meta',`${number(s.duracionMin)} min · ${s.activo?'Activo':'Inactivo'} · ${number(s.citasMes)} citas este mes`));list.append(row);});block.append(list);root.append(block);const rentable=services.filter(s=>Number.isFinite(Number(s.rentabilidadHora))&&Number(s.rentabilidadHora)>0);if(rentable.length){const r=section('Ingreso estimado por hora','Precio observado y duración programada de citas atendidas');const card=el('div','surface');card.append(bars(rentable,'rentabilidadHora',s=>s.nombre||'Servicio',money));r.append(card);root.append(r);}}
  function renderReportes(data){const root=$('contenido-reportes');root.replaceChildren();if(metadata(data.meta))root.append(metadata(data.meta));root.append(chart(data.grafica30));const k=section('Indicadores');k.append(kpiGrid(data.kpis||{}));root.append(k);const split=el('div','split');const hours=section('Ocupación por hora');const a=el('div','surface');a.append(bars(array(data.ocupacion),'citas',x=>x.hora||'—',number));hours.append(a);const services=section('Servicios más solicitados');const b=el('div','surface');b.append(bars(array(data.servicios),'citas',x=>x.nombre||'Servicio',number));services.append(b);append(split,hours,services);root.append(split);}
  function renderConfig(){const root=$('contenido-config');root.replaceChildren();const area=section('Sesión y datos');const card=el('div','surface');const dl=el('dl','info-list');[['Acceso','Sesión protegida en este navegador'],['Fuente de indicadores','Registros de Postgres'],['Citas externas','Google Calendar y Sheets pueden diferir de estos datos'],['Mensajes','Se envían solo después de tu confirmación']].forEach(([term,value])=>{const row=el('div');append(row,el('dt','',term),el('dd','',value));dl.append(row);});card.append(dl);area.append(card);root.append(area);}
  async function load(view){if($('panel').hidden)return;const current=++state.generation;loading(view);try{let path;if(view==='dashboard')path='resumen';else if(view==='agenda')path=`citas?desde=${encodeURIComponent(state.date)}&page=${state.pages.agenda}&pageSize=20`;else if(view==='clientes')path=`clientes?q=${encodeURIComponent(state.query)}&page=${state.pages.clientes}&pageSize=20`;else if(view==='servicios')path='servicios';else if(view==='reportes')path='reportes';else{renderConfig();return;}const result=await api(path);if(current!==state.generation||state.view!==view)return;({dashboard:renderDashboard,agenda:renderAgenda,clientes:renderClientes,servicios:renderServicios,reportes:renderReportes})[view](result);}catch(err){if(current===state.generation&&state.view===view&&!$('panel').hidden)errorView(view,err.message);}}
  function openPrice(service){if(!state.csrf||!Number.isSafeInteger(service.precioVersion)||service.precioVersion<1)return;state.pendingPrice={clave:service.clave,nombre:service.nombre,anterior:service.precio,version:service.precioVersion};$('precio-servicio').textContent=`${service.nombre}: precio actual ${price(service.precio)}.`;$('precio-valor').value=Number(service.precio).toFixed(2);$('precio-confirmacion').textContent='Confirma el nuevo importe antes de guardarlo. Las citas existentes conservarán su precio registrado.';$('precio-error').hidden=true;$('confirmar-precio').disabled=false;$('precio-dialogo').showModal();$('precio-valor').focus();}
  $('precio-dialogo').addEventListener('close',()=>{state.pendingPrice=null;});$('cancelar-precio').addEventListener('click',()=>$('precio-dialogo').close());
  $('precio-form').addEventListener('submit',async e=>{e.preventDefault();const pending=state.pendingPrice;if(!pending)return;const valor=$('precio-valor').value.trim();if(!/^(?:0|[1-9][0-9]{0,5})(?:\.[0-9]{1,2})?$/.test(valor)||!(Number(valor)>0&&Number(valor)<=999999.99)){$('precio-error').textContent='Indica un precio positivo (máximo 999999.99 MXN, dos decimales).';$('precio-error').hidden=false;return;}if(!window.confirm(`¿Cambiar ${pending.nombre} de ${price(pending.anterior)} a ${price(valor)}?`))return;$('confirmar-precio').disabled=true;$('precio-error').hidden=true;try{await api('servicios/precio',{method:'POST',body:{clave:pending.clave,precio:valor,version:pending.version}});$('precio-dialogo').close();$('aviso-global').replaceChildren(notice('Precio actualizado. Verifica la sincronización del agente antes de comunicarlo a clientes.'));load('servicios');}catch(err){$('precio-error').textContent=err.code==='PRICE_CONFLICT'?'El precio cambió en otra sesión. Cierra este diálogo y recarga la lista para revisar el importe actual.':err.message;$('precio-error').hidden=false;if(err.code!=='PRICE_CONFLICT')$('confirmar-precio').disabled=false;}});
  function openMessage(target,name){if(!state.csrf)return;state.pending={target,idempotencia:crypto.randomUUID()};$('mensaje-destinatario').textContent='Destinatario: '+name+'. El envío ocurre únicamente al confirmar.';$('mensaje-texto').value='';$('mensaje-error').hidden=true;$('confirmar-mensaje').disabled=false;$('mensaje-dialogo').showModal();$('mensaje-texto').focus();}
  $('mensaje-dialogo').addEventListener('close',()=>{state.pending=null;});$('cancelar-mensaje').addEventListener('click',()=>$('mensaje-dialogo').close());
  $('mensaje-form').addEventListener('submit',async e=>{e.preventDefault();if(!state.pending)return;const texto=$('mensaje-texto').value.trim();if(!texto)return;const pending=state.pending;$('confirmar-mensaje').disabled=true;$('mensaje-error').hidden=true;try{await api('mensajes',{method:'POST',body:{...pending.target,texto,idempotencia:pending.idempotencia}});$('mensaje-dialogo').close();$('aviso-global').replaceChildren(notice('Solicitud aceptada por el proveedor. La entrega al destinatario no está confirmada.'));}catch(err){const uncertain=err.code==='IN_PROGRESS'||err.code==='UNKNOWN'||err.code==='SEND_UNKNOWN'||err.status===409||!err.status||err.status>=500;$('mensaje-error').textContent=uncertain?'No se puede confirmar el resultado del envío. No lo repetiremos automáticamente; verifica el estado con el administrador antes de intentar otro mensaje.':err.message;$('mensaje-error').hidden=false;if(!uncertain)$('confirmar-mensaje').disabled=false;}});
  $('login-form').addEventListener('submit',async e=>{e.preventDefault();const submit=$('login-form').querySelector('button');submit.disabled=true;$('login-error').hidden=true;try{unlock(await api('login',{method:'POST',body:{password:$('password').value}}));$('password').value='';}catch(err){$('login-error').textContent=err.message;$('login-error').hidden=false;}finally{submit.disabled=false;}});
  $('salir').addEventListener('click',async()=>{try{await api('logout',{method:'POST'});lock();}catch(err){$('aviso-global').replaceChildren(notice(err.message,'error'));}});
  document.querySelectorAll('.nav-item').forEach(b=>b.addEventListener('click',()=>show(b.dataset.vista)));
  $('tema').addEventListener('click',()=>{const dark=document.documentElement.dataset.tema!=='oscuro';document.documentElement.dataset.tema=dark?'oscuro':'claro';$('tema').textContent=dark?'Tema claro':'Tema oscuro';$('tema').setAttribute('aria-label','Cambiar a tema '+(dark?'claro':'oscuro'));});
  checkSession();
})();
</script>
