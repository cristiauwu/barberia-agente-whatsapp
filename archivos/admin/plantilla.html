<!doctype html>
<html lang="es" data-tema="claro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="color-scheme" content="light dark">
<title>Barber Chinos · Administración</title>
<style>
/*@FUENTES@*/
:root{--fondo:#f1ede7;--papel:#fffcf7;--tinta:#29241f;--medio:#59534b;--tenue:#6f675d;--linea:#d9d1c7;--acento:#865039;--acento-tinta:#fff;--sombra:none;--sans:Inter,system-ui,sans-serif;--mono:'JetBrains Mono',ui-monospace,monospace}
html[data-tema="oscuro"]{color-scheme:dark;--fondo:#1c1a18;--papel:#292522;--tinta:#f7f0e9;--medio:#d1c8bd;--tenue:#b7aea3;--linea:#50463d;--acento:#e5b399;--acento-tinta:#211a16;--sombra:none}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--fondo);color:var(--tinta);font:14px/1.5 var(--sans);-webkit-font-smoothing:antialiased}button,input,textarea{font:inherit}button{cursor:pointer}button:disabled{opacity:.55;cursor:not-allowed}a{color:var(--acento);text-underline-offset:3px}input,textarea{color:var(--tinta);background:var(--papel);border:1px solid var(--linea);border-radius:10px;padding:12px 14px;min-height:44px;max-width:100%;width:100%;caret-color:var(--acento)}input::placeholder,textarea::placeholder{color:var(--tenue)}:focus-visible{outline:3px solid var(--acento);outline-offset:3px}::selection{background:var(--acento);color:var(--acento-tinta)}[hidden]{display:none!important}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.shell{min-height:100vh}.rail{background:var(--papel);border-bottom:1px solid var(--linea);padding:14px 16px 0}.brand{font-weight:760;letter-spacing:-.035em;font-size:1.2rem;display:flex;align-items:center;justify-content:space-between;gap:12px;padding-bottom:14px}.brand-mark{display:inline-block;width:8px;height:18px;margin-right:9px;background:var(--acento);border-radius:2px;transform:skew(-17deg)}.nav{display:flex;gap:4px;overflow-x:auto;scrollbar-width:thin;scrollbar-color:var(--linea) transparent;padding-bottom:10px}.nav-item{background:none;border:0;border-radius:9px;color:var(--medio);display:inline-flex;align-items:center;gap:9px;padding:10px 12px;white-space:nowrap;min-height:44px}.nav-item.activo{background:var(--tinta);color:var(--papel)}.nav-item:hover:not(.activo){background:var(--fondo)}.nav-item svg{flex:none}.rail-actions{display:flex;gap:5px;align-items:center}.plain{border:1px solid var(--linea);color:var(--tinta);background:var(--papel);border-radius:9px;min-height:40px;padding:7px 12px}.plain:hover{background:var(--fondo)}.logout{white-space:nowrap}
main{max-width:1460px;padding:25px 16px 80px;margin:0 auto}.vista-cab{border-bottom:1px solid var(--linea);padding-bottom:20px;margin-bottom:22px}h1{font-weight:720;letter-spacing:-.045em;line-height:1.1;font-size:clamp(2rem,5vw,3.3rem);margin:0 0 7px}.vista-sub{color:var(--medio);margin:0;font-size:.92rem}h2{font-size:1.1rem;line-height:1.25;letter-spacing:-.025em;margin:0}h3{font-size:.96rem;margin:0 0 8px}p{margin:0}.section{margin:28px 0 36px}.section-heading{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:13px}.section-heading small,.muted{color:var(--medio)}.surface{background:var(--papel);border:1px solid var(--linea);border-radius:14px;padding:18px}.grid{display:grid;gap:12px}.metrics{grid-template-columns:repeat(2,minmax(0,1fr))}.metric{min-height:125px;display:flex;flex-direction:column;justify-content:space-between}.metric strong{font-size:clamp(1.45rem,4vw,2.5rem);letter-spacing:-.06em;font-weight:680;line-height:1.15;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}.metric-label{font-size:.78rem;color:var(--medio);line-height:1.35}.metric-primary{background:var(--acento);color:var(--acento-tinta);border-color:var(--acento)}.metric-primary .metric-label{color:var(--acento-tinta)}.split{display:grid;gap:24px}.list{padding:0;overflow:hidden}.row{display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:8px 12px;align-items:center;padding:15px 16px;border-top:1px solid var(--linea)}.row:first-child{border-top:0}.time{font-family:var(--mono);font-size:.77rem;font-variant-numeric:tabular-nums}.row-main{min-width:0}.row-title{font-weight:650;line-height:1.3;overflow-wrap:anywhere}.row-detail{color:var(--medio);font-size:.82rem;overflow-wrap:anywhere}.row-extra{grid-column:2 / -1;display:flex;gap:9px;align-items:center;justify-content:space-between}.row .action{font-size:.77rem;padding:7px 10px}.tag{display:inline-flex;align-items:center;max-width:100%;border:1px solid var(--linea);border-radius:100px;padding:3px 9px;font-size:.72rem;color:var(--medio);white-space:nowrap}.tag::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;margin-right:7px}.tag.confirmada,.tag.atendida{color:var(--acento)}.tag.cancelada,.tag.no_show{color:#a35147}.tag.pendiente{color:#94702d}.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;margin-bottom:14px}.toolbar label{display:grid;gap:5px;font-size:.8rem;color:var(--medio);min-width:min(100%,210px)}.toolbar input{font-size:.9rem}.action{border:0;border-radius:9px;background:var(--acento);color:var(--acento-tinta);font-weight:650;padding:10px 16px;min-height:40px}.action:hover{filter:brightness(.9)}.toolbar .plain{min-height:44px}.status{border:1px solid var(--linea);background:var(--papel);border-radius:12px;padding:18px;color:var(--medio)}.status strong{display:block;color:var(--tinta);margin-bottom:5px}.status p{margin-bottom:12px}.notice{background:var(--papel);border:1px solid var(--linea);padding:11px 14px;border-radius:10px;color:var(--medio);margin-bottom:18px;font-size:.82rem}.notice.error{border-color:#a35147;color:var(--tinta)}.loading{color:var(--medio);padding:22px 0}.bar-list{display:grid;gap:12px}.bar-row{display:grid;grid-template-columns:minmax(0,135px) minmax(0,1fr) auto;align-items:center;gap:9px;font-size:.78rem}.bar-row span:first-child{overflow-wrap:anywhere}.track{background:var(--fondo);height:10px;border-radius:7px;overflow:hidden}.fill{display:block;background:var(--acento);height:100%;border-radius:7px}.money{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:.8rem}.service{padding:16px 0;border-top:1px solid var(--linea)}.service:first-child{border:0;padding-top:0}.service:last-child{padding-bottom:0}.service-top{display:flex;justify-content:space-between;gap:12px;align-items:baseline}.service-meta{font-size:.8rem;color:var(--medio);margin-top:5px}.info-list{margin:0}.info-list div{display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid var(--linea);padding:10px 0}.info-list div:last-child{border:0}.info-list dt{color:var(--medio)}.info-list dd{margin:0;text-align:right;font-weight:600;overflow-wrap:anywhere}.pagination{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:14px}.pagination span{font-size:.8rem;color:var(--medio)}
.login-wrap{min-height:100vh;display:grid;place-items:center;padding:20px}.login-card{max-width:420px;width:100%;background:var(--papel);padding:clamp(22px,5vw,38px);border:1px solid var(--linea);border-radius:16px}.login-card h1{margin:8px 0 12px}.login-card p{color:var(--medio);margin-bottom:22px}.login-card label{display:block;font-weight:600;margin-bottom:6px}.login-card input{margin-bottom:15px}.login-card .action{width:100%;min-height:46px}.login-card .notice{margin-top:14px;margin-bottom:0}dialog{border:1px solid var(--linea);border-radius:16px;background:var(--papel);color:var(--tinta);box-shadow:0 25px 90px rgba(0,0,0,.22);width:min(100% - 28px,520px);padding:24px}dialog::backdrop{background:rgba(12,22,17,.58)}dialog h2{font-size:1.5rem;margin-bottom:8px}dialog p{color:var(--medio);margin-bottom:18px}dialog label{display:block;font-weight:600;margin-bottom:6px}dialog textarea{min-height:116px;resize:vertical}dialog input{margin-bottom:12px}.service-actions{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.service-actions .plain{min-height:36px}.dialog-actions{display:flex;justify-content:flex-end;flex-wrap:wrap;gap:10px;margin-top:16px}.dialog-error{margin-top:12px;color:#a35147}
@media(min-width:740px){.metrics{grid-template-columns:repeat(4,minmax(0,1fr))}.split{grid-template-columns:minmax(0,1.2fr) minmax(0,.8fr)}.row{grid-template-columns:80px minmax(0,1fr) auto auto}.row-extra{grid-column:auto;justify-content:flex-end}}@media(min-width:1100px){.shell{display:grid;grid-template-columns:220px minmax(0,1fr)}.rail{position:sticky;top:0;height:100vh;border-bottom:0;border-right:1px solid var(--linea);display:flex;flex-direction:column;padding:26px 12px}.brand{padding:0 12px 30px;font-size:1.05rem}.nav{display:grid;overflow:visible;align-content:start}.nav-item{width:100%;text-align:left}.rail-actions{margin-top:auto;display:grid;padding:10px}.rail-actions button{width:100%}main{width:100%;padding:40px clamp(25px,4vw,60px) 100px}}@media(max-width:389px){.nav-item{padding:8px}.row{grid-template-columns:48px minmax(0,1fr)}.row>.tag{grid-column:2}.bar-row{grid-template-columns:80px minmax(0,1fr)}.bar-row .money{grid-column:2;text-align:right}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<noscript><div class="login-wrap"><div class="login-card"><h1>JavaScript necesario</h1><p>Este panel necesita JavaScript y conexión al servidor para mostrar datos reales. Habilítalo y vuelve a cargar la página.</p></div></div></noscript>
<div id="acceso" class="login-wrap" hidden><form id="login-form" class="login-card"><span class="brand-mark" aria-hidden="true"></span><span class="muted">Área privada</span><h1>Barber Chinos</h1><p>Ingresa la contraseña de administración para consultar la actividad del negocio.</p><label for="password">Contraseña</label><input id="password" name="password" type="password" autocomplete="current-password" required><button type="submit" class="action">Entrar al panel</button><div id="login-error" class="notice error" role="alert" hidden></div></form></div>
<div id="panel" class="shell" hidden>
  <aside class="rail"><div class="brand"><span><span class="brand-mark" aria-hidden="true"></span>Barber Chinos</span></div><nav id="nav" class="nav" aria-label="Secciones"><!--@NAV@--></nav><div class="rail-actions"><button id="tema" class="plain" type="button" aria-label="Cambiar a tema oscuro">Tema oscuro</button><button id="salir" class="plain logout" type="button">Cerrar sesión</button></div></aside>
  <main id="principal"><div id="aviso-global" role="status" aria-live="polite"></div><!--@VISTAS@--></main>
</div>
<dialog id="precio-dialogo" aria-labelledby="precio-titulo"><form id="precio-form"><h2 id="precio-titulo">Editar precio</h2><p id="precio-servicio"></p><label for="precio-valor">Nuevo precio (MXN)</label><input id="precio-valor" type="text" inputmode="decimal" autocomplete="off" required pattern="[0-9]+(\.[0-9]{1,2})?" maxlength="9"><p id="precio-confirmacion"></p><div id="precio-error" class="dialog-error" role="alert" hidden></div><div class="dialog-actions"><button type="button" id="cancelar-precio" class="plain">Cancelar</button><button type="submit" class="action" id="confirmar-precio">Guardar precio</button></div></form></dialog>
<dialog id="mensaje-dialogo" aria-labelledby="mensaje-titulo"><form id="mensaje-form"><h2 id="mensaje-titulo">Enviar mensaje</h2><p id="mensaje-destinatario"></p><label for="mensaje-texto">Mensaje para WhatsApp</label><textarea id="mensaje-texto" maxlength="1000" required placeholder="Escribe un mensaje claro y breve"></textarea><div id="mensaje-error" class="dialog-error" role="alert" hidden></div><div class="dialog-actions"><button type="button" id="cancelar-mensaje" class="plain">Cancelar</button><button type="submit" class="action" id="confirmar-mensaje">Confirmar y enviar</button></div></form></dialog>
<!--@JS@-->
</body>
</html>
